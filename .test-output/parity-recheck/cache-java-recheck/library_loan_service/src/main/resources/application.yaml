# A SINGLE `management:` root key --
# YAML parsers (SnakeYAML included) silently keep only the LAST occurrence
# of a duplicate top-level mapping key, so the Prometheus-exposure and
# tracing sub-blocks below MUST merge under one `management:` entry, never
# render as two separate top-level `management:` keys.
management:
  # Expose ONLY the Prometheus scrape endpoint over HTTP -- the
  # generated /live, /ready, /health family (a separate, DSL-owned domain,
  # see generators/cross_cutting/health_generator.py) is deliberately NOT
  # re-exposed here to avoid two competing health surfaces.
  endpoints:
    web:
      exposure:
        include: prometheus
  # Micrometer Tracing sampling rate, from the declared
  # provider's own sampling_rate (verified against the real Boot 4.1
  # reference docs -- docs.spring.io/spring-boot/reference/actuator/
  # tracing.html -- `management.tracing.sampling.probability` is the exact
  # property name).
  tracing:
    sampling:
      probability: 0.1
  opentelemetry:
    tracing:
      export:
        otlp:
          # `management.opentelemetry.tracing.export.otlp.endpoint` -- Boot
          # 4.1's OWN property namespace for the `spring-boot-starter-
          # opentelemetry` starter's autoconfigured OTLP span exporter
          # (verified against the real v4.1.0 tracing.adoc reference doc,
          # NOT assumed from Boot 3.x's now-superseded `management.otlp
          # .tracing.endpoint`). Sourced from the standard
          # OTEL_EXPORTER_OTLP_ENDPOINT env var via Spring's own
          # `${VAR:default}` runtime-placeholder syntax -- a genuinely
          # deploy-time-only value (the collector endpoint), not a
          # connection param this package routes through RemoteConfig; the
          # env var is genuinely consumed by the autoconfigured exporter
          # bean, not merely documented.
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Spring Boot's own NATIVE structured-logging
# support (Boot 3.4+, confirmed still current in 4.1 against the real
# v4.1.0 features/logging.adoc reference doc) -- requires NO extra Logback
# XML and NO third-party encoder Maven dependency for the built-in formats
# (ecs/gelf/logstash). `ecs` also merges every
# SLF4J MDC key-value pair into the JSON payload, which is what carries
# Micrometer Tracing's own traceId/spanId MDC entries into the log line
# whenever tracing is also active.
logging:
  structured:
    format:
      console: ecs
