groups:
  - name: library-book-service-standard
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_errors_total{service="library-book-service",status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{service="library-book-service"}[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: critical
          service: library-book-service
        annotations:
          summary: "High error rate on library-book-service"
          description: "5xx error rate above 5% for 5 minutes."
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service="library-book-service"}[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
          service: library-book-service
        annotations:
          summary: "High P95 latency on library-book-service"
          description: "P95 latency above 2 seconds for 5 minutes."
      - alert: DatabaseConnectionPoolExhausted
        expr: sum(sqlalchemy_pool_checked_out{service="library-book-service"}) / clamp_min(sum(sqlalchemy_pool_size{service="library-book-service"}), 1) > 0.9
        for: 2m
        labels:
          severity: critical
          service: library-book-service
        annotations:
          summary: "DB pool nearly exhausted on library-book-service"
          description: "Checked-out connections exceed 90% of configured pool capacity."
      - alert: HighRedisCacheMissRatio
        expr: sum(rate(redis_cache_misses_total{service="library-book-service"}[15m])) / clamp_min(sum(rate(redis_cache_hits_total{service="library-book-service"}[15m])) + sum(rate(redis_cache_misses_total{service="library-book-service"}[15m])), 1e-9) > 0.5
        for: 15m
        labels:
          severity: warning
          service: library-book-service
        annotations:
          summary: "High Redis miss ratio on library-book-service"
          description: "More than half of cache lookups are misses over 15 minutes."
      - alert: JobFailureRate
        expr: increase(job_failures_total{service="library-book-service"}[1h]) > 0
        for: 10m
        labels:
          severity: warning
          service: library-book-service
        annotations:
          summary: "Background job failures on library-book-service"
          description: "At least one job failure recorded in the last hour."
  - name: library-book-service-dsl
    rules:
      - alert: mq_consumer_lag_high
        expr: max_over_time(mq_consumer_lag[5m]) > 1000.0
        for: 5m
        labels:
          severity: critical
          service: library-book-service
          block: mq
        annotations:
          summary: "mq.consumerLag max exceeds 1000.0"
          description: "max(mq_consumer_lag) over 5m > 1000.0"
