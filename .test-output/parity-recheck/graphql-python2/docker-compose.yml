services:
  library-book-service:
    build:
      context: ./library_book_service
      dockerfile: Dockerfile
    image: library-book-service:latest
    container_name: library-book-service
    ports:
    - 127.0.0.1::8000
    environment:
      PORT: '8000'
      SERVICE_NAME: library-book-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://library-system-jaeger:4317
      DEBUG: 'false'
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      JWT_ALGORITHM: RS256
      JWT_EXPIRY: '3600'
      JWT_ISSUER: library
    depends_on:
      library-book-service-book-db-db:
        condition: service_healthy
      library-book-service-mq:
        condition: service_healthy
      library-book-service-mq-init:
        condition: service_completed_successfully
      library-system-jaeger:
        condition: service_healthy
    volumes:
    - ./secrets/jwt-private-key.pem:/run/secrets/jwt_private_key:ro
    - ./secrets/jwt-public-key.pem:/run/secrets/jwt_public_key:ro
    - ./config/services/library-book-service/config-store.json:/app/config/config-store.json:ro
    secrets:
    - source: library-book-service__book_db_password
      target: book_db_password
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
    - backend
    - broker
    - database
    - observability
    restart: unless-stopped
  library-book-service-book-db-db:
    image: postgres:17-alpine
    container_name: library-book-service-book-db-db
    ports:
    - '5432'
    environment:
      POSTGRES_DB: library_books
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: IgBNJOIkfvmh7pA562SsPzmh
    volumes:
    - library-book-service-book-db-db-data:/var/lib/postgresql/data
    - ./scripts/init-db/library-book-service-book-db-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
    - database
    restart: unless-stopped
  library-book-service-mq:
    image: confluentinc/cp-kafka:7.6.0
    container_name: library-book-service-mq
    ports:
    - '9092'
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@library-book-service-mq:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://library-book-service-mq:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
    - library-book-service-mq-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 60s
    networks:
    - broker
    restart: unless-stopped
  library-book-service-mq-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: library-book-service-mq-init
    volumes:
    - ./scripts/init-topics:/scripts/init-topics:ro
    command:
    - /bin/bash
    - /scripts/init-topics/library-book-service-mq.sh
    depends_on:
      library-book-service-mq:
        condition: service_healthy
    networks:
    - broker
    restart: 'no'
  library-system-cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: library-system-cadvisor
    ports:
    - '8080'
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:8080/healthz
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
    - observability
    restart: unless-stopped
  library-system-prometheus:
    image: prom/prometheus:v2.49.1
    container_name: library-system-prometheus
    ports:
    - '9090'
    volumes:
    - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./config/prometheus/rules:/etc/prometheus/rules:ro
    - prometheus-data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:9090/-/healthy
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
    - backend
    - observability
    restart: unless-stopped
  library-system-jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: library-system-jaeger
    ports:
    - '16686'
    - '14268'
    - '4317'
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    volumes:
    - ./config/jaeger/sampling_strategies.json:/etc/jaeger/sampling_strategies.json:ro
    command:
    - --sampling.strategies-file=/etc/jaeger/sampling_strategies.json
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:14269/
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
    - observability
    restart: unless-stopped
  library-system-loki:
    image: grafana/loki:2.9.10
    container_name: library-system-loki
    ports:
    - '3100'
    volumes:
    - loki-data:/loki
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
    - observability
    restart: unless-stopped
  library-system-promtail:
    image: grafana/promtail:2.9.10
    container_name: library-system-promtail
    ports:
    - '9080'
    volumes:
    - ./config/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
    - /var/lib/docker/containers:/var/lib/docker/containers:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
    - -config.file=/etc/promtail/config.yml
    depends_on:
      library-system-loki:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:9080/ready || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
    - observability
    restart: unless-stopped
  library-system-alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: library-system-alertmanager
    ports:
    - '9093'
    volumes:
    - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:9093/-/healthy || exit
        1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
    - observability
    restart: unless-stopped
  library-system-grafana:
    image: grafana/grafana:10.2.3
    container_name: library-system-grafana
    ports:
    - '3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: http://${GATEWAY_HOST:-localhost}:${GATEWAY_PORT:-8080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    volumes:
    - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafana-data:/var/lib/grafana
    depends_on:
      library-system-cadvisor:
        condition: service_healthy
      library-system-prometheus:
        condition: service_healthy
      library-system-jaeger:
        condition: service_healthy
      library-system-loki:
        condition: service_healthy
      library-system-promtail:
        condition: service_healthy
      library-system-alertmanager:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
    - observability
    restart: unless-stopped
  library-system-api-gateway:
    image: nginx:1.25-alpine
    container_name: library-system-api-gateway
    ports:
    - ${GATEWAY_PORT:-8080}:80
    volumes:
    - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      library-book-service:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - nginx
      - -t
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
    - backend
    - frontend
    - observability
    restart: unless-stopped
volumes:
  library-book-service-book-db-db-data:
    driver: local
  library-book-service-mq-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
networks:
  backend:
    driver: bridge
  broker:
    driver: bridge
  database:
    driver: bridge
  frontend:
    driver: bridge
  observability:
    driver: bridge
secrets:
  library-book-service__book_db_password:
    file: ./secrets/library-book-service/book_db_password
