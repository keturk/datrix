groups:
  - name: library-notification-service-standard
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_errors_total{service="library-notification-service",status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{service="library-notification-service"}[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: critical
          service: library-notification-service
        annotations:
          summary: "High error rate on library-notification-service"
          description: "5xx error rate above 5% for 5 minutes."
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service="library-notification-service"}[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
          service: library-notification-service
        annotations:
          summary: "High P95 latency on library-notification-service"
          description: "P95 latency above 2 seconds for 5 minutes."
      - alert: DatabaseConnectionPoolExhausted
        expr: sum(sqlalchemy_pool_checked_out{service="library-notification-service"}) / clamp_min(sum(sqlalchemy_pool_size{service="library-notification-service"}), 1) > 0.9
        for: 2m
        labels:
          severity: critical
          service: library-notification-service
        annotations:
          summary: "DB pool nearly exhausted on library-notification-service"
          description: "Checked-out connections exceed 90% of configured pool capacity."
