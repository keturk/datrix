    - ./config/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
    - /var/lib/docker/containers:/var/lib/docker/containers:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
    - -config.file=/etc/promtail/config.yml
    depends_on:
      examples-serverless-demo-system-loki:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:9080/ready || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
    - observability
    restart: unless-stopped
  examples-serverless-demo-system-alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: examples-serverless-demo-system-alertmanager
    ports:
    - '9093'
    volumes:
    - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:9093/-/healthy || exit
        1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
    - observability
    restart: unless-stopped
  examples-serverless-demo-system-grafana:
    image: grafana/grafana:10.2.3
    container_name: examples-serverless-demo-system-grafana
    ports:
    - '3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: http://${GATEWAY_HOST:-localhost}:${GATEWAY_PORT:-8080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    volumes:
    - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafana-data:/var/lib/grafana
    depends_on:
      examples-serverless-demo-system-cadvisor:
        condition: service_healthy
      examples-serverless-demo-system-prometheus:
        condition: service_healthy
      examples-serverless-demo-system-jaeger:
        condition: service_healthy
      examples-serverless-demo-system-loki:
        condition: service_healthy
      examples-serverless-demo-system-promtail:
        condition: service_healthy
      examples-serverless-demo-system-alertmanager:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
    - observability
    restart: unless-stopped
  ingestion-pipeline-minio:
    image: minio/minio:latest
    container_name: ingestion-pipeline-minio
    ports:
    - '9000'
    - '9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD_INGESTION_PIPELINE}
    volumes:
    - ingestion-pipeline-minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
    - storage
    restart: unless-stopped
  init-storage-ingestion-pipeline:
    image: minio/mc:RELEASE.2024-01-13T08-44-48Z
    container_name: init-storage-ingestion-pipeline
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD_INGESTION_PIPELINE}
    entrypoint:
    - /bin/sh
    - -c
    command:
    - mc alias set local http://ingestion-pipeline-minio:9000 "$$MINIO_ROOT_USER"
      "$$MINIO_ROOT_PASSWORD" && mc mb local/files --ignore-existing && echo 'Storage
      initialization complete'
    depends_on:
      ingestion-pipeline-minio:
        condition: service_healthy
    networks:
    - storage
    restart: 'no'
  examples-serverless-demo-system-api-gateway:
    image: nginx:1.25-alpine
    container_name: examples-serverless-demo-system-api-gateway
    ports:
    - ${GATEWAY_PORT:-8080}:80
    volumes:
    - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      examples-ingestion-service:
        condition: service_healthy
      examples-order-service:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - nginx
      - -t
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
    - backend
    - frontend
    - observability
    restart: unless-stopped
volumes:
  examples-order-service-db-db-data:
    driver: local
  examples-order-service-queue-rabbitmq-data:
    driver: local
  examples-serverless-demo-system-kafka-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  ingestion-pipeline-minio-data:
    driver: local
networks:
  backend:
    driver: bridge
  broker:
    driver: bridge
  database:
    driver: bridge
  frontend:
    driver: bridge
  observability:
    driver: bridge
  storage:
    driver: bridge
secrets:
  examples-order-service__db_password:
