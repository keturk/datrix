  examples-order-service-queue-worker__queues_password:
    file: ./secrets/examples-order-service-queue-worker/queues_password
  examples-order-service-event-handlers-consumer__db_password:
    file: ./secrets/examples-order-service-event-handlers-consumer/db_password
  examples-order-service-event-handlers-consumer__queues_password:
    file: ./secrets/examples-order-service-event-handlers-consumer/queues_password
  examples-order-service-event-handlers-http__db_password:
    file: ./secrets/examples-order-service-event-handlers-http/db_password
  examples-order-service-event-handlers-http__queues_password:
    file: ./secrets/examples-order-service-event-handlers-http/queues_password
  examples-order-service-scheduled-tasks-scheduler__db_password:
    file: ./secrets/examples-order-service-scheduled-tasks-scheduler/db_password
  examples-order-service-scheduled-tasks-scheduler__queues_password:
    file: ./secrets/examples-order-service-scheduled-tasks-scheduler/queues_password
  examples-order-service-queue-workers-queue-worker__db_password:
    file: ./secrets/examples-order-service-queue-workers-queue-worker/db_password
  examples-order-service-queue-workers-queue-worker__queues_password:
    file: ./secrets/examples-order-service-queue-workers-queue-worker/queues_password
