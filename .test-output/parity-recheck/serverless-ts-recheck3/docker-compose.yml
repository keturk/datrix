services:
  examples-ingestion-service:
    build:
      context: ./examples_ingestion_service
      dockerfile: Dockerfile
    image: examples-ingestion-service:latest
    container_name: examples-ingestion-service
    environment:
      PORT: '8002'
      SERVICE_NAME: examples-ingestion-service
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      JWT_ALGORITHM: RS256
      SERVICE_JWT_EXPIRY_MINUTES: ${SERVICE_JWT_EXPIRY_MINUTES:-60}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://examples-serverless-demo-system-jaeger:4317
      DEBUG: 'false'
      JWT_EXPIRY: '3600'
      JWT_ISSUER: library
    depends_on:
      examples-serverless-demo-system-jaeger:
        condition: service_healthy
    volumes:
    - ./secrets/jwt-private-key.pem:/run/secrets/jwt_private_key:ro
    - ./secrets/jwt-public-key.pem:/run/secrets/jwt_public_key:ro
    - ./config/services/examples-ingestion-service/config-store.json:/app/config/config-store.json:ro
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
    healthcheck:
      test:
      - CMD-SHELL
      - wget --quiet --tries=1 --spider http://localhost:8002/ready || exit 1
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
    - backend
    - observability
    restart: unless-stopped
  examples-ingestion-service-ingestion-handlers-consumer:
    image: examples-ingestion-service:latest
    container_name: examples-ingestion-service-ingestion-handlers-consumer
