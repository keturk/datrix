groups:
  - name: examples-order-service-standard
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_errors_total{service="examples-order-service",status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{service="examples-order-service"}[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: critical
          service: examples-order-service
        annotations:
          summary: "High error rate on examples-order-service"
          description: "5xx error rate above 5% for 5 minutes."
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service="examples-order-service"}[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
          service: examples-order-service
        annotations:
          summary: "High P95 latency on examples-order-service"
          description: "P95 latency above 2 seconds for 5 minutes."
      - alert: DatabaseConnectionPoolExhausted
        expr: sum(sqlalchemy_pool_checked_out{service="examples-order-service"}) / clamp_min(sum(sqlalchemy_pool_size{service="examples-order-service"}), 1) > 0.9
        for: 2m
        labels:
          severity: critical
          service: examples-order-service
        annotations:
          summary: "DB pool nearly exhausted on examples-order-service"
          description: "Checked-out connections exceed 90% of configured pool capacity."
      - alert: JobFailureRate
        expr: increase(job_failures_total{service="examples-order-service"}[1h]) > 0
        for: 10m
        labels:
          severity: warning
          service: examples-order-service
        annotations:
          summary: "Background job failures on examples-order-service"
          description: "At least one job failure recorded in the last hour."
