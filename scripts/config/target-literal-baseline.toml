# I1 Target-Literal Ratchet Baseline
#
# Frozen per-file counts of target-literal identifiers (language/provider
# names hardcoded in a shared layer -- Decision D1, Invariant I1).
# Any INCREASE in a file's count fails datrix/scripts/dev/check-import-boundaries.py
# --check-target-literals. Decreases are always allowed and should be captured
# by re-running with --update-baseline once a later change deletes an identifier
# (the terminal state is 0 for every entry here).
#
# Format:
#   [[baseline]]
#   file = "path/relative/to/monorepo-root, forward slashes"
#   count = <int>
#
# The loader/writer below (load_target_literal_baseline/write_target_literal_baseline)
# does not parse or round-trip a `reason` TOML key -- `--update-baseline` fully
# regenerates this file from a fresh scan, so a reason lives as a `#`-comment line
# directly above its `[[baseline]]` block instead (matching this header's own
# comment style); re-running `--update-baseline` preserves every entry's COUNT
# faithfully but does not carry a comment forward -- restore it by hand if that
# ever happens.
#
# A later round of entries reflects a widened scan: a target name used as a
# dict key, a `.get()` argument, an `==`/`in` comparand, an `isinstance`/
# `issubclass` class argument, or a dotted import-module segment. These
# surfaced additional real, pre-existing identifiers the earlier
# identifier-shape match alone could not see; none of them is new code
# written by that change either.

