# G2 Shared-Layer Target-Name Ratchet Baseline (Decision D4, Invariant I3)
#
# Frozen per-file counts of shared-layer identifiers (class, function,
# dataclass field, type alias, or type reference) carrying a registered
# language name OR one of that language's declared alias tokens
# (declaration_for_language(lang).name_tokens) as an identifier segment,
# in datrix_codegen_common and datrix_codegen_kernel.
# Any INCREASE in a file's count fails
# datrix/scripts/scan/lib/check_import_boundaries.py --check-shared-target-names.
# Decreases are always allowed and should be captured by re-running with
# --update-baseline once a later change deletes a target-named surface.
# Every entry is a reviewed exemption and MUST carry a written `reason`
# naming the identifiers, why they stay, and what drives them to zero;
# an entry without one fails the check. --update-baseline reads every
# reason back and re-emits it, and names a reasoned entry that no longer
# has a hit. The four sql/nosql-substring identifiers considered during
# this ratchet's design (sql_engine, sql_dialect, NoSQLSeedWriter,
# NoSqlFilterSyntax) are NOT hits under this ratchet's languages-only
# vocabulary (sql is not a registered datrix.languages entry) -- they are
# proven non-matches by this ratchet's own self-test, not baseline entries.
#
# Format:
#   [[baseline]]
#   file = "path/relative/to/monorepo-root, forward slashes"
#   count = <int>
#   reason = "identifiers, why they stay, what drives them to zero"

[[baseline]]
file = "datrix-codegen-common/src/datrix_codegen_common/algorithms/entity.py"
count = 1
reason = "EntityTsEmitSlice (:59, a type reference): the TypeScript entity-emit slice declared in context_models/entity.py and consumed by the TypeScript entity micro-generator and hooks, so it cannot be renamed inside this change without touching those packages. Drives to zero when the slice is renamed target-neutrally or moved into the TypeScript package, together with the context_models/entity.py entry."

[[baseline]]
file = "datrix-codegen-common/src/datrix_codegen_common/algorithms/pubsub_connection.py"
count = 6
reason = "_build_pubsub_nest_event_rows (:25), build_pubsub_nest_handler_rows (:65) and the PubsubNestEventRow / PubsubNestHandlerRow type references: NestJS-shaped pub/sub row builders whose row types are declared in context_models/pubsub_connection.py and consumed by the TypeScript pub/sub micro-generator, so a rename touches another package. Drives to zero with the context_models/pubsub_connection.py entry when the rows are renamed target-neutrally or move into the TypeScript package."

