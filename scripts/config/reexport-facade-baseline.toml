# Re-Export Facade Ratchet Baseline
#
# Frozen per-module counts of names that have a second import path
# through a facade -- a module that passes through a name it does
# not itself define, via its own __all__ or a self-aliased import
# (provider side); a `from M import N` anywhere that reaches through
# such a facade instead of the module that actually defines N
# (consumer side); a pyproject.toml entry point naming an attribute
# its target module does not define (entry-point side); or a
# `from M import N` whose M does not resolve to any module on disk
# at all (unresolved). Each entry's key is the PROVIDING module --
# its own relative file path when it resolves to a real file, or
# (only for the unresolved shape, where by definition no such file
# exists) the dotted module path that failed to resolve -- never
# the file where a consumer statement happens to appear, and its
# count combines every shape attributed to it.
#
# Any INCREASE in an entry's count fails
# datrix/scripts/dev/check-import-boundaries.py
# --check-reexport-facades. Decreases are always allowed and should
# be captured by re-running with --update-baseline once a later
# change rewrites a consumer to import from the module that
# actually defines the name, or empties a facade's __all__. A later
# migration drives every entry here to zero, one providing module
# at a time; once the last entry reaches zero this file is deleted,
# and the check becomes a hard zero with no baseline to consult.
#
# Format:
#   [[baseline]]
#   file = "path/relative/to/monorepo-root, forward slashes -- or,
#           for an unresolved-import entry, a dotted module path"
#   count = <int>

[[baseline]]
file = "datrix-common/src/datrix_common/errors/__init__.py"
count = 1

[[baseline]]
file = "datrix-common/src/datrix_common/fileops/__init__.py"
count = 2

