# G3 Cross-Package Vocabulary Ratchet Baseline (Decision D2.1-D2.4, Property 2)
#
# Frozen per-file counts of module-level set/frozenset/dict/tuple
# declarations whose normalized member set is declared -- with a
# bare string literal -- identically in two or more datrix-*
# packages (every package discover_packages() finds, not only the
# four language packages). Any INCREASE in a file's count fails
# datrix/scripts/dev/check-import-boundaries.py
# --check-cross-package-vocabulary. Decreases are always allowed
# and should be captured by re-running with --update-baseline once
# a later change deletes or hoists a redundant container.
#
# A handful of entries below are KNOWN-LEGITIMATE duplicates --
# each carries a written reason directly above its [[baseline]]
# entry (design decision D9) and must never be driven to zero; see
# each comment for why. Every other entry drives to 0 as later
# consolidation work removes the redundant copy.
#
# Format:
#   [[baseline]]
#   file = "path/relative/to/monorepo-root, forward slashes"
#   count = <int>
#
# Note on the design's anticipated D9 keep-list: of the five groups the
# design doc named as known-legitimate, only ONE (the per-platform
# identity-provider-realization dicts, annotated below on the four
# datrix-codegen-{aws,azure,docker}/plugin/capability.py and
# datrix-codegen-component/identity_metadata_generator.py entries) is an
# actual G3 hit under this scanner's exact contract (module-level
# Assign/AnnAssign to a bare-literal set/frozenset/dict/tuple, declared
# with >=1 bare string element, in >=2 distinct packages). The other four
# are NOT present in this baseline because they are not G3 hits at all:
#   - TRACING_PROVIDERS / *_REALIZED_TRACING_PROVIDERS: java's and
#     dotnet's declarations are built ENTIRELY from qualified
#     TracingProvider.MEMBER references (consumption, not a bare-literal
#     declaration); only typescript's language_capability.py declares a
#     bare literal, and a single package is not cross-package.
#   - _SUPPORTED_INCREMENTAL_OPERATIONS: both java's and dotnet's
#     declarations are built ENTIRELY from qualified ChangeKind.MEMBER
#     references -- consumption, not declaration, same reasoning as above.
#   - datrix-common/paths.py's docker_image/compose_service/
#     kebab_resource/infra_module: these are @property method bodies
#     (`return self._name.kebab`), never a module-level container literal
#     -- not a candidate shape for this ratchet at all.
#   - SharedMigrationTaskContext (datrix-codegen-aws): a `class ...
#     (TypedDict)` definition with annotated-only fields (no value), never
#     a module-level Assign/AnnAssign to a container literal -- not a
#     candidate shape for this ratchet at all.

