# G3 Cross-Package Vocabulary Ratchet Baseline (Decision D2.1-D2.4, Property 2)
#
# Frozen per-file counts of module-level set/frozenset/dict/tuple
# declarations whose normalized member set is declared -- with a
# bare string literal -- identically in two or more datrix-*
# packages (every package discover_packages() finds, not only the
# language packages). Any INCREASE in a file's count fails
# datrix/scripts/scan/check-import-boundaries.ps1
# --check-cross-package-vocabulary. Decreases are always allowed
# and should be captured by re-running with --update-baseline once
# a later change deletes or hoists a redundant container.
#
# An entry carrying a `reason` is a KNOWN-LEGITIMATE duplicate that
# a design requires (Decision 36: per-platform capability
# declarations and per-target realized-provider sets are declared
# once per target because their governing decisions forbid a shared
# table). Such an entry must never be driven to zero, and its reason
# is part of the frozen record: --update-baseline reads every reason
# back and re-emits it. Every entry WITHOUT a reason drives to 0 as
# later consolidation work removes the redundant copy.
#
# Format:
#   [[baseline]]
#   file = "path/relative/to/monorepo-root, forward slashes"
#   count = <int>
#   reason = "why a design requires this duplicate (optional)"

