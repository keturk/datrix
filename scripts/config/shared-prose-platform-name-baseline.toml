# Shared-Prose Platform-Name Ratchet Baseline (Principle 10)
#
# Frozen counts of registered platform names (datrix.platforms entry points,
# minus the English-word collisions the platform-token match excludes)
# spelled in comments, docstrings, string literals and f-string text of
# the derived shared-package set, one entry per (file, platform name).
# A (file, name) pair with no entry is held at zero, so a platform name
# entering shared prose anywhere new fails
# datrix/scripts/scan/check-import-boundaries.ps1 -CheckSharedProsePlatformNames.
# Any INCREASE fails; decreases are always allowed and are captured by
# re-running with -UpdateBaseline once a change rewords a mention.
# The target is an empty file: reword each mention provider-neutrally, or
# move the fact into the platform's own declaration.
#
# Format:
#   [[baseline]]
#   entry = "path/relative/to/monorepo-root, forward slashes::platform-name"
#   count = <int>

