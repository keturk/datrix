# Function-Level-Import Ratchet Baseline
#
# Frozen per-file counts of function-level imports (any Import/ImportFrom
# AST node that is not a direct top-level statement of its module --
# nested in a function/method body, an `if TYPE_CHECKING:` block, or a
# `try`/`except`) in the code that was datrix-common's before the
# foundation packages were extracted from it: every src/ file of
# datrix-common, datrix-semantic, datrix-migration and datrix-testing, plus
# each file an entry below names in another package (a former
# datrix-common module that moved up a layer; its entry moved with it).
#
# Decrease-only. Any INCREASE in a file's count fails
# datrix/scripts/dev/check-import-boundaries.py
# --check-function-level-imports, which check-import-boundaries.ps1 runs on
# every check invocation. --update-baseline only lowers counts and drops
# emptied entries; it refuses to raise one. A module that moves keeps its
# entry under the new path at the same count (a rename).
#
# Every entry carries a reason: the import cycle that forces its deferrals
# (both modules) or their measured import cost. An entry without one, an
# entry naming a file no scan reads, and a zero-count entry all fail the flag.
#
# Format:
#   [[baseline]]
#   file = "path/relative/to/monorepo-root, forward slashes"
#   count = <int>
#   reason = "the cycle (both modules) or the measured import cost"

[[baseline]]
