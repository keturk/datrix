            set $datrix_retry_after 60;
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 10s;
            set $datrix_target "http://ecommerce-grafana:3000/api/health";
            proxy_pass $datrix_target;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /grafana/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $datrix_cors_origin always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH' always;
                add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;
                add_header Access-Control-Max-Age 1728000 always;
                add_header Content-Length 0;
                add_header Content-Type 'text/plain; charset=UTF-8';
                return 204;
            }

            # CORS on the PROXIED response. Answering the preflight and then
            # returning an undecorated actual response is strictly worse than
            # emitting no CORS at all: the preflight succeeds, so the config
            # reads as healthy, while the browser discards every real response
            # as an opaque network error. The gateway declared the allow-list
            # and already owns the preflight and the error responses, so it owns
            # this too. A backend's own allow-list is a SEPARATE value that
            # nothing reconciles with this one, and it defaults to empty -- so
            # delegating the success path to the backend makes the whole
            # gateway.cors block a no-op exactly when it is load-bearing.
            # proxy_hide_header is what makes gateway ownership safe: a backend
            # that does set these would otherwise produce a duplicate
            # Access-Control-Allow-Origin, which browsers reject outright. Hide
            # the upstream's copy, emit one value resolved from $http_origin.
            # An empty $datrix_cors_origin (unrecognized origin, or a non-browser
            # client sending no Origin at all) makes nginx omit the header
            # rather than emit an empty one.
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            add_header Access-Control-Allow-Origin $datrix_cors_origin always;
            # The response now varies by request Origin, so any shared cache in
            # front of this gateway (a CDN, a managed API gateway) must key on
            # it or it will serve one origin's allow-header to another.
            add_header Vary Origin always;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
            set $datrix_target "http://ecommerce-grafana:3000";
            proxy_pass $datrix_target;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
