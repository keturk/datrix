services:
  ecommerce-user-service:
    build:
      context: ./ecommerce_user_service
      dockerfile: Dockerfile
    image: ecommerce-user-service:latest
    container_name: ecommerce-user-service
    ports:
    - 127.0.0.1::8006
    environment:
      PORT: '8006'
      SERVICE_NAME: ecommerce-user-service
      UV_THREADPOOL_SIZE: '16'
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      JWT_ALGORITHM: RS256
      SERVICE_JWT_EXPIRY_MINUTES: ${SERVICE_JWT_EXPIRY_MINUTES:-60}
      SMTP_HOST: ecommerce-mailpit
      SMTP_PORT: '1025'
      SMTP_FROM: noreply@example.com
      OTEL_EXPORTER_OTLP_ENDPOINT: http://ecommerce-jaeger:4317
      DEBUG: 'false'
      JWT_EXPIRY: '3600'
      JWT_ISSUER: library
      IDENTITY_IDENTITY_CLIENT_SECRET_REF: ${IDENTITY_IDENTITY_CLIENT_SECRET_REF}
      IDENTITY_PLATFORM_CLIENT_SECRET_REF: ${IDENTITY_PLATFORM_CLIENT_SECRET_REF}
      IDENTITY_MACHINE_CREDENTIALS_FILE: /machine-credentials/credentials.json
    depends_on:
      ecommerce-postgresql:
        condition: service_healthy
      ecommerce-redis:
        condition: service_healthy
      ecommerce-kafka:
        condition: service_healthy
      ecommerce-user-service-mq-init:
        condition: service_completed_successfully
      ecommerce-jaeger:
        condition: service_healthy
      ecommerce-zitadel:
        condition: service_healthy
      ecommerce-zitadel-init:
        condition: service_completed_successfully
      ecommerce-user-service-user-db-migrate:
        condition: service_completed_successfully
    volumes:
    - ./secrets/jwt-private-key.pem:/run/secrets/jwt_private_key:ro
    - ./secrets/jwt-public-key.pem:/run/secrets/jwt_public_key:ro
    - ./config/identity/identity-providers.json:/app/config/identity/identity-providers.json:ro
    - ecommerce-machine-credentials:/machine-credentials:ro
    - ./config/services/ecommerce-user-service/config-store.json:/app/config/config-store.json:ro
    secrets:
    - source: ecommerce-user-service__smtp_host
      target: smtp_host
    - source: ecommerce-user-service__smtp_password
      target: smtp_password
    - source: ecommerce-user-service__smtp_port
      target: smtp_port
    - source: ecommerce-user-service__smtp_username
      target: smtp_username
    - source: ecommerce-user-service__user_db_password
      target: user_db_password
    cpu_shares: 1024
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 704M
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:8006/ready || exit 1
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
    - backend
    - broker
    - cache
    - database
    - observability
    restart: unless-stopped
  ecommerce-product-service:
    build:
      context: ./ecommerce_product_service
      dockerfile: Dockerfile
    image: ecommerce-product-service:latest
    container_name: ecommerce-product-service
    ports:
    - 127.0.0.1::8004
