# Generated by Datrix -- do not edit manually
#
# One nginx server block per (app, web target) static site. Every header
# below comes verbatim from the one shared
# security-header set (datrix_codegen_kernel.platform.web_security_headers) --
# never a second, hand-written header list. SPA routing is scoped to the
# app's own declared page paths: a declared path serves index.html at 200;
# any other path also serves index.html's content (so the SPA's own
# `fallback` page still renders client-side) but at 404, via error_page,
# so a crawler or health probe sees the correct status.
#
# nginx inherits add_header from the enclosing level ONLY when a location
# declares none of its own, so every location that sets Cache-Control
# repeats the whole security-header set -- otherwise index.html, the runtime
# config and every hashed asset would be served without it.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8080 http://localhost:8080; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8080; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=()" always;

    # Content-hashed build output never changes under one filename -- safe
    # to cache forever.
    location ~* \.(js|mjs|css|svg|png|jpg|jpeg|webp|gif|ico|woff|woff2|ttf|otf|map)$ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8080 http://localhost:8080; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8080; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html and runtime-config.json are the two files a redeploy
    # overwrites in place -- a client must always revalidate them.
    location = /index.html {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8080 http://localhost:8080; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8080; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=()" always;
        add_header Cache-Control "no-cache" always;
    }

    # The DEPLOYED runtime config: written by the client-runtime resolver job
    # (late-bound client id resolved) into a read-only mount, never the
    # generated file.
    location = /runtime-config.json {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8080 http://localhost:8080; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8080; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=()" always;
        add_header Cache-Control "no-cache" always;
        alias /datrix-runtime-config/client-runtime-admin-angular.test.json;
    }


    # Anything else is unknown to the app's own router: serve the SPA shell
    # (so its `fallback` page still renders client-side) but at 404.
    location / {
        try_files $uri @datrix_unmatched;
    }

    location @datrix_unmatched {
        return 404;
    }

    error_page 404 /index.html;
}
