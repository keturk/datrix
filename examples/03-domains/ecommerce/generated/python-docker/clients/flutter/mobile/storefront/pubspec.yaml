name: storefront
description: 'Storefront: the generated mobile app. Never edited.'
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4
  flutter: ^3.47.5

dependencies:
  flutter:
    sdk: flutter
  datrix_client:
    path: ../..
  firebase_core: '4.15.0'
  firebase_messaging: '16.7.0'
  share_plus: '13.3.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '6.0.0'
  go_router: '18.0.1'
  http: '1.6.0'
  shared_preferences_platform_interface: '2.4.2'

flutter:
  uses-material-design: true
  assets:
    - assets/apps/storefront/
    - assets/cldr/
    - assets/config/
    - assets/strings/
