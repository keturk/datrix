# Garage single-node configuration for ecommerce-product-service.
# Auto-generated by datrix-codegen-docker. Do not edit manually.
#
# Secrets are not in this file: the RPC secret arrives as GARAGE_RPC_SECRET,
# the access key as GARAGE_DEFAULT_ACCESS_KEY / GARAGE_DEFAULT_SECRET_KEY.
# The RPC listener is bound to loopback (a single node talks to no peer) and
# the admin API is not configured, so the S3 API -- authenticated by the
# access key -- is the only listener other containers can reach.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

replication_factor = 1

rpc_bind_addr = "127.0.0.1:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "us-east-1"
api_bind_addr = "0.0.0.0:3900"
