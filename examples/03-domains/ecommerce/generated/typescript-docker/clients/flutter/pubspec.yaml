name: datrix_client
description: The generated Flutter client. Regenerated from the application's .dtrx; never edited.
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ^3.47.5

workspace:
  - mobile/storefront

dependencies:
  flutter:
    sdk: flutter
  fl_chart: '1.2.0'
  flutter_appauth: '12.1.0'
  flutter_map: '8.3.2'
  flutter_secure_storage: '11.2.0'
  go_router: '18.0.1'
  http: '1.6.0'
  latlong2: '0.10.1'
  logging: '1.3.0'
  markdown_widget: '2.3.2+8'
  shared_preferences: '2.5.5'
  url_launcher: '6.3.2'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '6.0.0'
  shared_preferences_platform_interface: '2.4.2'

flutter:
  uses-material-design: true
  assets:
    - assets/cldr/
